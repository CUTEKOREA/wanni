<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>완니 발음</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { min-height: 100vh; display: flex; flex-direction: column; justify-content: center;
    align-items: center; gap: 28px; background: #FFFDF6; color: #241F14; padding: 24px;
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-align: center; }
  .text { font-size: 34px; font-weight: 700; line-height: 1.4; word-break: keep-all;
    color: #2E3A87; max-width: 26em; }
  button { font-size: 22px; font-weight: 700; border: none; border-radius: 999px;
    padding: 18px 40px; cursor: pointer; }
  #play { background: #F2C900; color: #3D3300; font-size: 26px; }
  #slow { background: #EFEAD9; color: #6B6455; }
  .brand { color: #B9B29E; font-size: 14px; margin-top: 12px; }
</style>
</head>
<body>
  <div class="text" id="txt"></div>
  <button id="play">▶ 발음 듣기</button>
  <button id="slow">🐢 천천히</button>
  <div class="brand">완니 · วันนี้ · Today · 今天</div>
  <audio id="au"></audio>
  <script>
    const q = new URLSearchParams(location.search);
    const f = q.get("f") || "";
    document.getElementById("txt").textContent = q.get("t") || "";
    const au = document.getElementById("au");
    if (/^audio\/(th|en|zh)\/[a-z0-9_]+\.mp3$/.test(f)) au.src = f;
    function go(rate) { au.pause(); au.currentTime = 0; au.playbackRate = rate; au.play(); }
    document.getElementById("play").onclick = () => go(1.0);
    document.getElementById("slow").onclick = () => go(0.7);
    au.addEventListener("canplaythrough", () => go(1.0), { once: true }); // autoplay if allowed
  </script>
</body>
</html>
