name: daily-send

on:
  schedule:
    - cron: "40 22 * * *"   # 07:40 KST; daily.py sleeps until 23:00 UTC = 08:00 KST
  workflow_dispatch:
    inputs:
      day:
        description: "day number override (blank = auto)"
        required: false

concurrency: daily-send

permissions:
  contents: write
  issues: write

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
      START_DATE: "2026-08-19"
      CHROME_BIN: google-chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: render and send
        env:
          DAY_OVERRIDE: ${{ inputs.day }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "$DAY_OVERRIDE" ]; then
              python daily.py --day "$DAY_OVERRIDE"
            else
              python daily.py
            fi
          else
            python daily.py --wait "23:00"
          fi

      - name: persist rotated refresh token
        if: always()
        run: |
          if ! git diff --quiet -- state/tokens.enc; then
            git config user.name "wanni-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state/tokens.enc
            git commit -m "chore: rotate kakao refresh token"
            git push
          fi

      - name: alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "완니 발송 실패 $(date -u -d '+9 hours' +%F)" \
            --body "실패 런: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
